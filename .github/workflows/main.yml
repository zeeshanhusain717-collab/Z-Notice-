                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(25, 25, 25, 25)
                      elevation = 6f
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#F8F9FA"))
                          cornerRadius = 25f
                          setStroke(2, Color.parseColor("#E2E8F0"))
