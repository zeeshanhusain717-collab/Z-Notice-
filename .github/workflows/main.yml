                          <item android:offset="1.0" android:color="#1F0D08" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Leather Stitches -->
              <path
                  android:pathData="M 75,55 L 425,55 M 425,55 L 425,445 M 425,445 L 75,445 M 75,445 L 75,55"
                  android:strokeColor="#C89662"
                  android:strokeWidth="2" />

              <!-- Notebook Page -->
              <path
