              private fun saveFolderToDb(title: String, parentId: Long): Long {
                  val db = dbHelper.writableDatabase
                  val values = ContentValues().apply {
                      put("title", title)
                      put("content", "")
                      put("is_folder", 1)
                      put("parent_id", parentId)
                      put("is_locked", 0)
                      put("is_editor_locked", 1)
                  }
                  val id = db.insert("items", null, values)
                  updateMemoryUsage()
                  return id
              }

              private fun loadCurrentDirectoryItems() {
                  noticeListLayout.removeAllViews()
                  val db = dbHelper.readableDatabase
                  val cursor = db.rawQuery("SELECT * FROM items WHERE parent_id = ?", arrayOf(currentFolderId.toString()))
                  
                  if (cursor.count == 0) {
                      noticeListLayout.addView(emptyStateTv)
                      emptyStateTv.visibility = View.VISIBLE
                  } else {
                      emptyStateTv.visibility = View.GONE
                      while (cursor.moveToNext()) {
                          val id = cursor.getLong(cursor.getColumnIndexOrThrow("id"))
                          val title = cursor.getString(cursor.getColumnIndexOrThrow("title"))
                          val content = cursor.getString(cursor.getColumnIndexOrThrow("content"))
                          val isFolder = cursor.getInt(cursor.getColumnIndexOrThrow("is_folder")) == 1
                          val isLocked = cursor.getInt(cursor.getColumnIndexOrThrow("is_locked")) == 1
                          val isEditorLocked = cursor.getInt(cursor.getColumnIndexOrThrow("is_editor_locked")) == 1
                          
                          renderItemCard(ItemModel(id, title, content, isFolder, currentFolderId, isLocked, isEditorLocked))
                      }
                  }
                  cursor.close()
              }

              private fun renderItemCard(item: ItemModel) {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      elevation = 8f
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = 25f
                          setStroke(2, Color.parseColor("#D4AF37"))
                      }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply {
                          setMargins(0, 0, 0, 25)
                      }
                      setOnClickListener {
                          if (item.isFolder) {
                              if (item.isLocked) {
                                  promptPinLock("🔐 Locked Folder", "Enter PIN to unlock this folder:") {
                                      currentFolderId = item.id
                                      dashboardTitleTv.text = "📁 ${item.title}"
                                      loadCurrentDirectoryItems()
                                  }
                              } else {
                                  currentFolderId = item.id
                                  dashboardTitleTv.text = "📁 ${item.title}"
                                  loadCurrentDirectoryItems()
                              }
                          } else {
                              if (item.isLocked) {
                                  promptPinLock("🔐 Locked Page", "Enter PIN to unlock this page:") {
                                      editingNoteId = item.id
                                      openEditor(item.title, item.content)
                                  }
                              } else {
                                  editingNoteId = item.id
                                  openEditor(item.title, item.content)
                              }
                          }
                      }
                      setOnLongClickListener {
                          showOptionMenu(item)
                          true
                      }
                  }

                  val headerText = if (item.isFolder) {
                      if (item.isLocked) "🔐 📁 ${item.title} (Locked)" else "📁 ${item.title}"
                  } else {
                      if (item.isLocked) "🔐 📄 ${item.title} (Locked)" else "📄 ${item.title}"
                  }

                  val header = TextView(this).apply {
                      text = headerText
                      textSize = 16f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                      setPadding(25, 18, 25, 18)
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          intArrayOf(Color.parseColor("#5A3822"), Color.parseColor("#2B170C"))
                      ).apply {
                          cornerRadii = floatArrayOf(25f, 25f, 25f, 25f, 0f, 0f, 0f, 0f)
                      }
                  }

                  val body = TextView(this).apply {
                      val plainText = Html.fromHtml(item.content, Html.FROM_HTML_MODE_LEGACY).toString()
                      text = if (item.isFolder) {
                          if (item.isLocked) "🔒 Protected Folder (PIN required)" else "Folder (Tap to open)"
                      } else {
                          if (item.isLocked) {
                              "🔒 Protected Page (PIN required)"
                          } else {
                              if (plainText.length > 40) plainText.substring(0, 40) + "..." else plainText.ifEmpty { "Empty note" }
                          }
                      }
                      textSize = 13f
                      setTextColor(Color.parseColor("#444444"))
                      setPadding(25, 20, 25, 20)
                  }

                  card.addView(header)
                  card.addView(body)
                  noticeListLayout.addView(card)
              }

              private fun showOptionMenu(item: ItemModel) {
                  val lockOption = if (item.isLocked) "🔓 Remove Password" else "🔐 Add Password"
                  val options = arrayOf("✏ Rename", lockOption, "🗑 Delete")

                  AlertDialog.Builder(this)
                      .setTitle(item.title)
                      .setItems(options) { _, which ->
                          when (which) {
                              0 -> renameItem(item)
                              1 -> toggleItemLock(item)
                              2 -> deleteItem(item)
                          }
                      }
                      .show()
              }

              private fun toggleItemLock(item: ItemModel) {
                  val newLockState = if (item.isLocked) 0 else 1
                  val db = dbHelper.writableDatabase
                  val cv = ContentValues().apply { put("is_locked", newLockState) }
                  db.update("items", cv, "id = ?", arrayOf(item.id.toString()))
                  
                  val itemType = if (item.isFolder) "Folder" else "Page"
                  val msg = if (newLockState == 1) "🔒 $itemType successfully locked!" else "🔓 $itemType lock removed!"
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                  loadCurrentDirectoryItems()
              }

              private fun renameItem(item: ItemModel) {
                  val input = EditText(this).apply { setText(item.title) }
                  AlertDialog.Builder(this)
                      .setTitle("Rename")
                      .setView(input)
                      .setPositiveButton("SHOW") { _, _ ->
                          val newTitle = input.text.toString().ifEmpty { item.title }
                          val db = dbHelper.writableDatabase
                          val cv = ContentValues().apply { put("title", newTitle) }
                          db.update("items", cv, "id = ?", arrayOf(item.id.toString()))
                          loadCurrentDirectoryItems()
                      }
                      .setNegativeButton("CANCEL", null)
                      .show()
              }

              private fun deleteItem(item: ItemModel) {
                  val db = dbHelper.writableDatabase
                  db.delete("items", "id = ? OR parent_id = ?", arrayOf(item.id.toString(), item.id.toString()))
                  loadCurrentDirectoryItems()
                  updateMemoryUsage()
              }

              private fun saveCurrentNote() {
                  if (isMemoryFull()) {
                      showMemoryFullPopUp()
                      return
                  }

                  val htmlContent = Html.toHtml(noteEditText.text, Html.TO_HTML_PARAGRAPH_LINES_INDIVIDUAL)
                  val title = projectTitleTv.text.toString()

                  val db = dbHelper.writableDatabase
                  if (editingNoteId == null) {
                      val values = ContentValues().apply {
                          put("title", title)
                          put("content", htmlContent)
                          put("is_folder", 0)
                          put("parent_id", currentFolderId)
                          put("is_locked", 0)
                          put("is_editor_locked", 1)
                      }
                      editingNoteId = db.insert("items", null, values)
                  } else {
                      val cv = ContentValues().apply {
                          put("title", title)
                          put("content", htmlContent)
                          put("is_editor_locked", 1)
                      }
                      db.update("items", cv, "id = ?", arrayOf(editingNoteId.toString()))
                  }

                  Toast.makeText(this, "Page saved successfully!", Toast.LENGTH_SHORT).show()
                  closeEditor()
                  loadCurrentDirectoryItems()
                  updateMemoryUsage()
              }

              private fun openEditor(title: String, content: String) {
                  dashboardHeader.visibility = View.GONE
                  noticeListLayout.visibility = View.GONE
                  projectHeader.visibility = View.VISIBLE
                  editorLayout.visibility = View.VISIBLE
                  projectTitleTv.text = title

                  activeColor = Color.BLACK
                  updateColorButtonUI()

                  if (content.isNotEmpty()) {
                      noteEditText.setText(Html.fromHtml(content, Html.FROM_HTML_MODE_LEGACY))
                  } else {
                      noteEditText.setText("")
                  }

                  isPageEditorLocked = true
                  applyEditorLockUI()

                  if (isMemoryFull()) {
                      showMemoryFullPopUp()
                  }
              }

              private fun closeEditor() {
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(noteEditText.windowToken, 0)
                  projectHeader.visibility = View.GONE
                  editorLayout.visibility = View.GONE
                  dashboardHeader.visibility = View.VISIBLE
                  noticeListLayout.visibility = View.VISIBLE
                  activeColor = Color.BLACK
              }

              private fun updateMemoryUsage() {
                  Thread {
                      val bytes = getJavaStorageUsageBytes()
                      currentUsedBytesCached = bytes

                      val kbUsed = bytes.toDouble() / 1024.0
                      val mbUsed = kbUsed / 1024.0

                      val memoryText = when {
                          mbUsed >= 1.0 -> String.format("%.2f MB / 100 MB", mbUsed)
                          else -> String.format("%.2f KB / 100 MB", kbUsed)
                      }

                      val fraction = (bytes.toDouble() / MAX_STORAGE_BYTES.toDouble()).coerceIn(0.0, 1.0)
                      val targetWidth = (720 * fraction).toInt()

                      runOnUiThread {
                          drawerMemoryText.text = memoryText
                          drawerProgressView.layoutParams = FrameLayout.LayoutParams(targetWidth, -1)
                          
                          val bgDrawable = drawerProgressView.background as GradientDrawable
                          if (fraction >= 0.90) {
                              bgDrawable.setColor(Color.parseColor("#E74C3C"))
                          } else {
                              bgDrawable.setColor(Color.parseColor("#2ECC71"))
                          }
                      }
                  }.start()
              }
          }
          EOF

      # ==========================================
      # STEP 8: Compilation & Output Generation
      # ==========================================
      - name: "Robot Step 19: Execute Gradle Assemble Debug APK"
        run: gradle :app:assembleDebug --no-daemon

      - name: "Robot Step 20: Upload Generated APK Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-Notice-APK
          path: app/build/outputs/apk/debug/app-debug.apk

