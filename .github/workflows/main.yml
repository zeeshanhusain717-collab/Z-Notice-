              <path
                  android:pathData="M 220,160 L 320,160 L 320,190 L 250,285 L 320,285 L 320,320 L 215,320 L 215,290 L 285,195 L 220,195 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="215"
                          android:startY="160"
                          android:endX="320"
                          android:endY="320">
                          <item android:offset="0.0" android:color="#FFF176" />
                          <item android:offset="0.5" android:color="#FFB300" />
                          <item android:offset="1.0" android:color="#FF6F00" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Spiral Rings -->
              <path android:pathData="M 85,82 C 65,82 65,103 125,103 C 125,97 85,92 85,82 Z" android:fillColor="#FFB300"/>
              <path android:pathData="M 85,132 C 65,132 65,153 125,153 C 125,147 85,142 85,132 Z" android:fillColor="#FFB300"/>
              <path android:pathData="M 85,182 C 65,182 65,203 125,203 C 125,197 85,192 85,182 Z" android:fillColor="#FFB300"/>
              <path android:pathData="M 85,232 C 65,232 65,253 125,253 C 125,247 85,242 85,232 Z" android:fillColor="#FFB300"/>
              <path android:pathData="M 85,282 C 65,282 65,303 125,303 C 125,297 85,292 85,282 Z" android:fillColor="#FFB300"/>
              <path android:pathData="M 85,332 C 65,332 65,353 125,353 C 125,347 85,342 85,332 Z" android:fillColor="#FFB300"/>
              <path android:pathData="M 85,382 C 65,382 65,403 125,403 C 125,397 85,392 85,382 Z" android:fillColor="#FFB300"/>

              <!-- Golden Pen -->
              <path android:pathData="M 450,110 L 466,110 L 466,370 L 458,390 L 450,370 Z" android:fillColor="#FFB300" />
          </vector>
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
