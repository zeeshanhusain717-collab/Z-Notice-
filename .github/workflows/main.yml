name: Build Zeeshan Notice App APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # Core System Configurations
      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/notice
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # gradle.properties
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanNotice"
          include(":app")
          EOF

          # Root build.gradle
          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
          }
          EOF

          # App build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }
          android {
              namespace "com.zeeshan.notice"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.notice"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation "androidx.core:core-ktx:1.13.1"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              implementation "androidx.drawerlayout:drawerlayout:1.2.0"
              implementation "androidx.viewpager2:viewpager2:1.1.0"
          }
          EOF

      # Resources & Source Code Setup
      - name: Generate App Resources & Code
        run: |
          set -euo pipefail

          # strings.xml
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan Notice</string>
          </resources>
          EOF

          # 3D Vector Image Logo (ic_launcher.xml)
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:aapt="http://schemas.android.com/aapt"
              android:width="512dp"
              android:height="512dp"
              android:viewportWidth="512"
              android:viewportHeight="512">

              <!-- Deep 3D Shadow -->
              <path
                  android:pathData="M 65,85 A 35,35 0 0,1 100,50 L 412,50 A 35,35 0 0,1 447,85 L 447,427 A 35,35 0 0,1 412,462 L 100,462 A 35,35 0 0,1 412,462 L 100,462 A 35,35 0 0,1 65,427 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="radial"
                          android:centerX="256"
                          android:centerY="256"
                          android:gradientRadius="260">
                          <item android:offset="0.0" android:color="#90000000" />
                          <item android:offset="1.0" android:color="#00000000" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Leather Cover Base (Chocolaty Theme) -->
              <path
                  android:pathData="M 60,70 A 30,30 0 0,1 90,40 L 410,40 A 30,30 0 0,1 440,70 L 440,430 A 30,30 0 0,1 410,460 L 90,460 A 30,30 0 0,1 60,430 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="60"
                          android:startY="40"
                          android:endX="440"
                          android:endY="460">
                          <item android:offset="0.0" android:color="#4E2A1E" />
                          <item android:offset="0.4" android:color="#361B12" />
                          <item android:offset="1.0" android:color="#1F0D08" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Leather Stitches (Golden) -->
              <path
                  android:pathData="M 75,55 L 425,55 M 425,55 L 425,445 M 425,445 L 75,445 M 75,445 L 75,55"
                  android:strokeColor="#D4AF37"
                  android:strokeWidth="2" />

              <!-- Notebook Page -->
              <path
                  android:pathData="M 122,70 A 15,15 0 0,1 137,55 L 390,55 A 15,15 0 0,1 405,70 L 405,420 A 15,15 0 0,1 390,435 L 137,435 A 15,15 0 0,1 122,420 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="122"
                          android:startY="55"
                          android:endX="405"
                          android:endY="435">
                          <item android:offset="0.0" android:color="#FFFFFF" />
                          <item android:offset="0.85" android:color="#FDFBF7" />
                          <item android:offset="1.0" android:color="#F4EFEA" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Golden 'Z' Logo -->
              <path
                  android:pathData="M 220,160 L 320,160 L 320,190 L 250,285 L 320,285 L 320,320 L 215,320 L 215,290 L 285,195 L 220,195 Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:type="linear"
                          android:startX="215"
                          android:startY="160"
                          android:endX="320"
                          android:endY="320">
                          <item android:offset="0.0" android:color="#FFF176" />
                          <item android:offset="0.5" android:color="#FFD700" />
                          <item android:offset="1.0" android:color="#C59B27" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Write MainActivity.kt
        run: |
          cat > app/src/main/java/com/zeeshan/notice/MainActivity.kt <<'EOF'
          package com.zeeshan.notice

          import android.app.AlertDialog
          import android.app.Dialog
          import android.content.ContentValues
          import android.content.Context
          import android.content.SharedPreferences
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewGroup
          import android.view.Window
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.GravityCompat
          import androidx.drawerlayout.widget.DrawerLayout
          import com.google.android.material.navigation.NavigationView
          import java.io.File

          data class ItemModel(
              val id: Long,
              val title: String,
              val content: String,
              val isFolder: Boolean,
              val parentFolderId: Long,
              val isLocked: Boolean,
              val isEditorLocked: Boolean = false
          )

          class DynamicCanvasEditText(context: Context) : androidx.appcompat.widget.AppCompatEditText(context) {
              var pageStyle: String = "Plain"
                  set(value) {
                      field = value
                      invalidate()
                  }

              var customTextColor: Int = Color.BLACK
                  set(value) {
                      field = value
                      setTextColor(value)
                      invalidate()
                  }

              private var scaleFactor = 1.0f
              private val baseTextSizeSp = 16f

              private val scaleDetector = ScaleGestureDetector(context, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                  override fun onScale(detector: ScaleGestureDetector): Boolean {
                      scaleFactor *= detector.scaleFactor
                      scaleFactor = scaleFactor.coerceIn(1.0f, 6.0f)
                      textSize = baseTextSizeSp * scaleFactor
                      return true
                  }
              })

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (!isFocusable) {
                      scaleDetector.onTouchEvent(event)
                  }
                  return super.onTouchEvent(event)
              }

              private val linePaint = Paint().apply {
                  color = Color.parseColor("#D4AF37")
                  strokeWidth = 1.5f
              }

              private val marginPaint = Paint().apply {
                  color = Color.parseColor("#4E2A1E")
                  strokeWidth = 2.5f
              }

              override fun onDraw(canvas: Canvas) {
                  when (pageStyle) {
                      "Ruled" -> {
                          val lineH = lineHeight
                          val count = height / lineH
                          for (i in 1..count) {
                              val y = (i * lineH).toFloat()
                              canvas.drawLine(0f, y, width.toFloat(), y, linePaint)
                          }
                      }
                      "Grid" -> {
                          val step = 60f
                          var x = 0f
                          while (x < width) {
                              canvas.drawLine(x, 0f, x, height.toFloat(), linePaint)
                              x += step
                          }
                          var y = 0f
                          while (y < height) {
                              canvas.drawLine(0f, y, width.toFloat(), y, linePaint)
                              y += step
                          }
                      }
                      "Margin" -> {
                          val lineH = lineHeight
                          val count = height / lineH
                          for (i in 1..count) {
                              val y = (i * lineH).toFloat()
                              canvas.drawLine(0f, y, width.toFloat(), y, linePaint)
                          }
                          canvas.drawLine(90f, 0f, 90f, height.toFloat(), marginPaint)
                      }
                  }
                  super.onDraw(canvas)
              }
          }

          class DatabaseHelper(context: Context) : SQLiteOpenHelper(context, "ZeeshanNotice.db", null, 8) {
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE items (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT, content TEXT, is_folder INTEGER, parent_id INTEGER, is_locked INTEGER DEFAULT 0, is_editor_locked INTEGER DEFAULT 0)")
              }
              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  db.execSQL("DROP TABLE IF EXISTS items")
                  onCreate(db)
              }
          }

          class MainActivity : AppCompatActivity() {

              companion object {
                  const val MAX_STORAGE_BYTES: Long = 100L * 1024L * 1024L 
              }

              @Volatile private var currentUsedBytesCached: Long = 0L

              private lateinit var dbHelper: DatabaseHelper
              private lateinit var prefs: SharedPreferences
              private lateinit var drawerLayout: DrawerLayout
              private lateinit var mainContainer: LinearLayout
              private lateinit var dashboardHeader: FrameLayout
              private lateinit var projectHeader: LinearLayout
              private lateinit var dashboardTitleTv: TextView
              private lateinit var projectTitleTv: TextView
              private lateinit var drawerMemoryText: TextView
              private lateinit var drawerProgressView: View
              private lateinit var editorLayout: LinearLayout
              private lateinit var noticeListLayout: LinearLayout
              private lateinit var emptyStateTv: TextView
              private lateinit var noteEditText: DynamicCanvasEditText
              private lateinit var colorMenuBtn: Button
              private lateinit var lockToggleBtn: Button

              private var currentFolderId: Long = 0L
              private var editingNoteId: Long? = null
              private var selectedStyleTemp: String = "Plain"

              private var activeColor: Int = Color.BLACK
              private var isPageEditorLocked = true

              private val chocolatyThemeColor = Color.parseColor("#361B12")
              private val goldenThemeColor = Color.parseColor("#D4AF37")
              private val whiteThemeColor = Color.parseColor("#FFFFFF")

              private val original24Colors = intArrayOf(
                  Color.BLACK, Color.parseColor("#1C1C1C"), Color.parseColor("#361B12"), Color.parseColor("#4E2A1E"),
                  Color.parseColor("#8B0000"), Color.parseColor("#FF0000"), Color.parseColor("#D4AF37"), Color.parseColor("#FFD700"),
                  Color.parseColor("#32CD32"), Color.parseColor("#008000"), Color.parseColor("#006400"), Color.parseColor("#00FFFF"),
                  Color.parseColor("#1E90FF"), Color.parseColor("#0000FF"), Color.parseColor("#00008B"), Color.parseColor("#8A2BE2"),
                  Color.parseColor("#4B0082"), Color.parseColor("#9932CC"), Color.parseColor("#FF00FF"), Color.parseColor("#FF1493"),
                  Color.parseColor("#A52A2A"), Color.parseColor("#800000"), Color.parseColor("#556B2F"), Color.parseColor("#4682B4")
              )

              private val color48List = ArrayList<Int>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  dbHelper = DatabaseHelper(this)
                  prefs = getSharedPreferences("ZeeshanNoticePrefs", Context.MODE_PRIVATE)

                  generate48ColorsData()

                  drawerLayout = DrawerLayout(this).apply {
                      layoutParams = FrameLayout.LayoutParams(-1, -1)
                  }

                  mainContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(whiteThemeColor)
