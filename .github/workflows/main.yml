              private fun mixWith50PercentWhite(color: Int): Int {
                  val r = (Color.red(color) + 255) / 2
                  val g = (Color.green(color) + 255) / 2
                  val b = (Color.blue(color) + 255) / 2
                  return Color.rgb(r, g, b)
              }

              private fun generate48ColorsData() {
                  color48List.clear()
                  for (col in original24Colors) {
                      color48List.add(col)
                  }
                  for (col in original24Colors) {
                      color48List.add(mixWith50PercentWhite(col))
                  }
              }

              private fun getJavaStorageUsageBytes(): Long {
                  var totalSize: Long = 0
                  try {
                      val dbFile = getDatabasePath("ZeeshanNotice.db")
                      if (dbFile.exists()) {
                          totalSize += dbFile.length()
                      }
                      val filesDirSize = getFolderSize(filesDir)
                      totalSize += filesDirSize
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  return totalSize
              }

              private fun getFolderSize(file: File): Long {
                  var size: Long = 0
                  if (file.isDirectory) {
                      val files = file.listFiles()
                      if (files != null) {
                          for (f in files) {
                              size += getFolderSize(f)
                          }
                      }
                  } else if (file.exists()) {
                      size = file.length()
                  }
                  return size
              }

              private fun isMemoryFull(): Boolean {
                  return currentUsedBytesCached >= MAX_STORAGE_BYTES
              }

              private fun showMemoryFullPopUp() {
                  AlertDialog.Builder(this)
                      .setTitle("⚠️ Memory Full!")
                      .setMessage("Your 100 MB memory is full!\n\nPlease delete old items to free up space.")
                      .setPositiveButton("OK", null)
                      .show()
              }

              private fun toggleEditorLockState() {
                  if (isMemoryFull()) {
                      showMemoryFullPopUp()
                      isPageEditorLocked = true
                      applyEditorLockUI()
                      return
                  }
                  isPageEditorLocked = !isPageEditorLocked
                  applyEditorLockUI()
              }

              private fun applyEditorLockUI() {
                  if (isPageEditorLocked) {
                      lockToggleBtn.text = "🔒"
                      noteEditText.isFocusable = false
                      noteEditText.isFocusableInTouchMode = false
                      noteEditText.clearFocus()
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.hideSoftInputFromWindow(noteEditText.windowToken, 0)
                      if (!isMemoryFull()) {
                          Toast.makeText(this, "🔒 Page Locked (Scroll & View Active)", Toast.LENGTH_SHORT).show()
                      }
                  } else {
                      lockToggleBtn.text = "🔓"
                      noteEditText.isFocusable = true
                      noteEditText.isFocusableInTouchMode = true
                      noteEditText.requestFocus()
                      val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showSoftInput(noteEditText, InputMethodManager.SHOW_IMPLICIT)
                      Toast.makeText(this, "🔓 Unlocked! Typing enabled", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun promptPinLock(title: String, message: String, onSuccess: () -> Unit) {
                  val masterPin = prefs.getString("master_pin", "1234")
                  val input = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_VARIATION_PASSWORD
                      hint = "Enter 4-Digit PIN"
                  }
                  val dialog = AlertDialog.Builder(this)
                      .setTitle(title)
                      .setMessage(message)
                      .setView(input)
                      .setCancelable(true)
                      .setPositiveButton("SHOW", null)
                      .setNegativeButton("CANCEL", null)
                      .create()

                  dialog.setOnShowListener {
                      val button = dialog.getButton(AlertDialog.BUTTON_POSITIVE)
                      button.setOnClickListener {
                          val entered = input.text.toString().trim()
                          if (entered == masterPin) {
                              dialog.dismiss()
                              onSuccess()
                          } else {
                              Toast.makeText(this, "❌ Incorrect PIN!", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  dialog.show()
              }

