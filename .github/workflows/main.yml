name: Build Zeeshan Notice App APK (Java Edition)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      # Core System Configurations (100% Java - No Kotlin)
      - name: Generate Build Configurations
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/zeeshan/notice
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.daemon=false
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ZeeshanNotice"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }
          android {
              namespace "com.zeeshan.notice"
              compileSdk 34
              defaultConfig {
                  applicationId "com.zeeshan.notice"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.constraintlayout:constraintlayout:2.1.4"
              implementation "androidx.drawerlayout:drawerlayout:1.2.0"
          }
          EOF

      # Resources & Source Code Setup
      - name: Generate App Resources
        run: |
          set -euo pipefail

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Zeeshan Notice</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # Writing the JAVA Code (Converted from Kotlin)
      - name: Write MainActivity.java
        run: |
          cat > app/src/main/java/com/zeeshan/notice/MainActivity.java <<'EOF'
          package com.zeeshan.notice;

          import android.app.AlertDialog;
          import android.app.Dialog;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.InputType;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.ScaleGestureDetector;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.view.GravityCompat;
          import androidx.drawerlayout.widget.DrawerLayout;
          import com.google.android.material.navigation.NavigationView;
          import java.io.File;
          import java.util.ArrayList;

          class ItemModel {
              long id; String title; String content; boolean isFolder; long parentFolderId; boolean isLocked; boolean isEditorLocked;
              public ItemModel(long id, String title, String content, boolean isFolder, long parentFolderId, boolean isLocked, boolean isEditorLocked) {
                  this.id = id; this.title = title; this.content = content; this.isFolder = isFolder; this.parentFolderId = parentFolderId; this.isLocked = isLocked; this.isEditorLocked = isEditorLocked;
              }
          }

          class DynamicCanvasEditText extends androidx.appcompat.widget.AppCompatEditText {
              private String pageStyle = "Plain";
              public int customTextColor = Color.BLACK;
              private float scaleFactor = 1.0f;
              private final float baseTextSizeSp = 16f;
              private ScaleGestureDetector scaleDetector;
              private Paint linePaint;
              private Paint marginPaint;

              public DynamicCanvasEditText(Context context) {
                  super(context);
                  scaleDetector = new ScaleGestureDetector(context, new ScaleGestureDetector.SimpleOnScaleGestureListener() {
                      @Override public boolean onScale(ScaleGestureDetector detector) {
                          scaleFactor *= detector.getScaleFactor();
                          scaleFactor = Math.max(1.0f, Math.min(scaleFactor, 6.0f));
                          setTextSize(baseTextSizeSp * scaleFactor);
                          return true;
                      }
                  });
                  linePaint = new Paint();
                  linePaint.setColor(Color.parseColor("#CCCCCC"));
                  linePaint.setStrokeWidth(2f);
                  marginPaint = new Paint();
                  marginPaint.setColor(Color.parseColor("#FF5555"));
                  marginPaint.setStrokeWidth(3f);
              }

              public void setPageStyle(String style) { this.pageStyle = style; invalidate(); }
              public String getPageStyle() { return this.pageStyle; }

              @Override public boolean onTouchEvent(MotionEvent event) {
                  if (!isFocusable()) { scaleDetector.onTouchEvent(event); }
                  return super.onTouchEvent(event);
              }

              @Override protected void onDraw(Canvas canvas) {
                  if (pageStyle.equals("Ruled") || pageStyle.equals("Vertical")) {
                      int lineH = getLineHeight();
                      int count = getHeight() / lineH;
                      for (int i = 1; i <= count; i++) {
                          float y = (float) (i * lineH);
                          canvas.drawLine(0f, y, getWidth(), y, linePaint);
                      }
                      if (pageStyle.equals("Vertical")) {
                          canvas.drawLine(90f, 0f, 90f, getHeight(), marginPaint);
                      }
                  } else if (pageStyle.equals("Grid")) {
                      float step = 60f;
                      for (float x = 0f; x < getWidth(); x += step) { canvas.drawLine(x, 0f, x, getHeight(), linePaint); }
                      for (float y = 0f; y < getHeight(); y += step) { canvas.drawLine(0f, y, getWidth(), y, linePaint); }
                  }
                  super.onDraw(canvas);
              }
          }

          class DatabaseHelper extends SQLiteOpenHelper {
              public DatabaseHelper(Context context) { super(context, "ZeeshanNotice.db", null, 8); }
              @Override public void onCreate(SQLiteDatabase db) {
                  db.execSQL("CREATE TABLE items (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT, content TEXT, is_folder INTEGER, parent_id INTEGER, is_locked INTEGER DEFAULT 0, is_editor_locked INTEGER DEFAULT 0)");
              }
              @Override public void onUpgrade(SQLiteDatabase db, int oldVersion, int newVersion) {
                  db.execSQL("DROP TABLE IF EXISTS items");
                  onCreate(db);
              }
          }

          public class MainActivity extends AppCompatActivity {

              public static final long MAX_STORAGE_BYTES = 100L * 1024L * 1024L;
              private volatile long currentUsedBytesCached = 0L;

              private DatabaseHelper dbHelper;
              private SharedPreferences prefs;
              private DrawerLayout drawerLayout;
              private LinearLayout mainContainer;
              private FrameLayout dashboardHeader;
              private LinearLayout projectHeader;
              private TextView dashboardTitleTv;
              private TextView projectTitleTv;
              private TextView drawerMemoryText;
              private View drawerProgressView;
              private LinearLayout editorLayout;
              private LinearLayout noticeListLayout;
              private TextView emptyStateTv;
              private DynamicCanvasEditText noteEditText;
              private Button colorMenuBtn;
              private Button lockToggleBtn;

              private long currentFolderId = 0L;
              private Long editingNoteId = null;
              private String selectedStyleTemp = "Plain";
              private int activeColor = Color.BLACK;
              private boolean isPageEditorLocked = true;
              private ArrayList<Integer> color48List = new ArrayList<>();

              private final int[] original24Colors = new int[]{
                  Color.BLACK, Color.parseColor("#1C1C1C"), Color.parseColor("#2F4F4F"),
                  Color.parseColor("#8B0000"), Color.parseColor("#FF0000"), Color.parseColor("#FF4500"),
                  Color.parseColor("#FF8C00"), Color.parseColor("#FFD700"), Color.parseColor("#32CD32"),
                  Color.parseColor("#008000"), Color.parseColor("#006400"), Color.parseColor("#00FFFF"),
                  Color.parseColor("#1E90FF"), Color.parseColor("#0000FF"), Color.parseColor("#00008B"),
                  Color.parseColor("#8A2BE2"), Color.parseColor("#4B0082"), Color.parseColor("#9932CC"),
                  Color.parseColor("#FF00FF"), Color.parseColor("#FF1493"), Color.parseColor("#A52A2A"),
                  Color.parseColor("#800000"), Color.parseColor("#556B2F"), Color.parseColor("#4682B4")
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  dbHelper = new DatabaseHelper(this);
                  prefs = getSharedPreferences("ZeeshanNoticePrefs", Context.MODE_PRIVATE);

                  generate48ColorsData();

                  drawerLayout = new DrawerLayout(this);
                  drawerLayout.setLayoutParams(new FrameLayout.LayoutParams(-1, -1));

                  mainContainer = new LinearLayout(this);
                  mainContainer.setOrientation(LinearLayout.VERTICAL);
                  mainContainer.setBackgroundColor(Color.parseColor("#F8F9FA"));
                  mainContainer.setLayoutParams(new FrameLayout.LayoutParams(-1, -1));

                  dashboardHeader = new FrameLayout(this);
                  GradientDrawable headerBg = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, new int[]{Color.parseColor("#2D3748"), Color.parseColor("#1A202C")});
                  dashboardHeader.setBackground(headerBg);
                  dashboardHeader.setPadding(24, 30, 24, 30);
                  dashboardHeader.setElevation(10f);
                  dashboardHeader.setLayoutParams(new LinearLayout.LayoutParams(-1, -2));

                  TextView menuBtn = new TextView(this);
                  menuBtn.setText("≡");
                  menuBtn.setTextSize(28f);
                  menuBtn.setTextColor(Color.WHITE);
                  menuBtn.setTypeface(null, Typeface.BOLD);
                  menuBtn.setPadding(20, 0, 20, 0);
                  menuBtn.setLayoutParams(new FrameLayout.LayoutParams(-2, -2, Gravity.START | Gravity.CENTER_VERTICAL));
                  menuBtn.setOnClickListener(v -> drawerLayout.openDrawer(GravityCompat.START));

                  dashboardTitleTv = new TextView(this);
                  dashboardTitleTv.setText("𝐙𝐞𝐞𝐬𝐡𝐚𝐧 𝐍𝐨𝐭𝐢𝐜𝐞");
                  dashboardTitleTv.setTextSize(22f);
                  dashboardTitleTv.setTypeface(null, Typeface.BOLD);
                  dashboardTitleTv.setTextColor(Color.WHITE);
                  dashboardTitleTv.setGravity(Gravity.CENTER);
                  dashboardTitleTv.setLayoutParams(new FrameLayout.LayoutParams(-1, -2, Gravity.CENTER));

                  dashboardHeader.addView(dashboardTitleTv);
                  dashboardHeader.addView(menuBtn);

                  projectHeader = new LinearLayout(this);
                  projectHeader.setOrientation(LinearLayout.HORIZONTAL);
                  projectHeader.setGravity(Gravity.CENTER_VERTICAL);
                  projectHeader.setPadding(30, 35, 30, 35);
                  projectHeader.setBackground(headerBg);
                  projectHeader.setVisibility(View.GONE);
                  projectHeader.setElevation(10f);

                  TextView backBtn = new TextView(this);
                  backBtn.setText("←");
                  backBtn.setTextSize(26f);
                  backBtn.setTextColor(Color.WHITE);
                  backBtn.setTypeface(null, Typeface.BOLD);
                  backBtn.setPadding(0, 0, 25, 0);
                  backBtn.setOnClickListener(v -> closeEditor());

                  projectTitleTv = new TextView(this);
                  projectTitleTv.setText("New Page");
                  projectTitleTv.setTextSize(18f);
                  projectTitleTv.setTypeface(null, Typeface.BOLD);
                  projectTitleTv.setTextColor(Color.WHITE);
                  projectTitleTv.setLayoutParams(new LinearLayout.LayoutParams(0, -2, 1f));

                  TextView saveBtn = new TextView(this);
                  saveBtn.setText("✔ SAVE");
                  saveBtn.setTextSize(15f);
                  saveBtn.setTypeface(null, Typeface.BOLD);
                  saveBtn.setTextColor(Color.parseColor("#38BDF8"));
                  saveBtn.setOnClickListener(v -> saveCurrentNote());

                  projectHeader.addView(backBtn);
                  projectHeader.addView(projectTitleTv);
                  projectHeader.addView(saveBtn);

                  noticeListLayout = new LinearLayout(this);
                  noticeListLayout.setOrientation(LinearLayout.VERTICAL);
                  noticeListLayout.setPadding(30, 30, 30, 30);
                  noticeListLayout.setLayoutParams(new LinearLayout.LayoutParams(-1, 0, 1f));

                  emptyStateTv = new TextView(this);
                  emptyStateTv.setText("No folders or pages available.\nTap '+' below to create a new folder or page.");
                  emptyStateTv.setTextSize(15f);
                  emptyStateTv.setTextColor(Color.GRAY);
                  emptyStateTv.setGravity(Gravity.CENTER);
                  emptyStateTv.setLayoutParams(new LinearLayout.LayoutParams(-1, -1));
                  noticeListLayout.addView(emptyStateTv);

                  editorLayout = new LinearLayout(this);
                  editorLayout.setOrientation(LinearLayout.VERTICAL);
                  editorLayout.setBackgroundColor(Color.WHITE);
                  editorLayout.setVisibility(View.GONE);
                  editorLayout.setLayoutParams(new LinearLayout.LayoutParams(-1, -1, 1f));

                  LinearLayout styleToolBar = new LinearLayout(this);
                  styleToolBar.setOrientation(LinearLayout.HORIZONTAL);
                  styleToolBar.setGravity(Gravity.END | Gravity.CENTER_VERTICAL);
                  styleToolBar.setPadding(20, 15, 20, 15);
                  styleToolBar.setBackgroundColor(Color.parseColor("#EDF2F7"));

                  colorMenuBtn = new Button(this);
                  colorMenuBtn.setText("🎨 Color");
                  colorMenuBtn.setTextSize(13f);
                  colorMenuBtn.setTextColor(Color.BLACK);
                  colorMenuBtn.setTypeface(null, Typeface.BOLD);
                  GradientDrawable colorBtnBg = new GradientDrawable();
                  colorBtnBg.setColor(Color.WHITE);
                  colorBtnBg.setCornerRadius(20f);
                  colorBtnBg.setStroke(3, Color.parseColor("#CBD5E0"));
                  colorMenuBtn.setBackground(colorBtnBg);
                  colorMenuBtn.setOnClickListener(v -> openCompactColorPicker());

                  Button styleMenuBtn = new Button(this);
                  styleMenuBtn.setText("📄 Style");
                  styleMenuBtn.setTextSize(13f);
                  styleMenuBtn.setTextColor(Color.parseColor("#2D3748"));
                  styleMenuBtn.setTypeface(null, Typeface.BOLD);
                  GradientDrawable styleBtnBg = new GradientDrawable();
                  styleBtnBg.setColor(Color.WHITE);
                  styleBtnBg.setCornerRadius(20f);
                  styleBtnBg.setStroke(2, Color.parseColor("#CBD5E0"));
                  styleMenuBtn.setBackground(styleBtnBg);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-2, -2);
                  lp.setMargins(15, 0, 0, 0);
                  styleMenuBtn.setLayoutParams(lp);
                  styleMenuBtn.setOnClickListener(v -> showPageStyleDialog());

                  lockToggleBtn = new Button(this);
                  lockToggleBtn.setText("🔒");
                  lockToggleBtn.setTextSize(15f);
                  GradientDrawable lockBtnBg = new GradientDrawable();
                  lockBtnBg.setColor(Color.WHITE);
                  lockBtnBg.setCornerRadius(20f);
                  lockBtnBg.setStroke(2, Color.parseColor("#CBD5E0"));
                  lockToggleBtn.setBackground(lockBtnBg);
                  lockToggleBtn.setLayoutParams(lp);
                  lockToggleBtn.setOnClickListener(v -> toggleEditorLockState());

                  styleToolBar.addView(colorMenuBtn);
                  styleToolBar.addView(styleMenuBtn);
                  styleToolBar.addView(lockToggleBtn);

                  noteEditText = new DynamicCanvasEditText(this);
                  noteEditText.setHint("Write your notice here...");
                  noteEditText.setTextSize(16f);
                  noteEditText.setPadding(40, 40, 40, 40);
                  noteEditText.setGravity(Gravity.TOP);
                  noteEditText.setBackgroundColor(Color.WHITE);
                  noteEditText.setLayoutParams(new LinearLayout.LayoutParams(-1, -1));

                  editorLayout.addView(styleToolBar);
                  editorLayout.addView(noteEditText);

                  FrameLayout fabLayout = new FrameLayout(this);
                  fabLayout.setLayoutParams(new LinearLayout.LayoutParams(-1, -2));

                  Button fabBtn = new Button(this);
                  fabBtn.setText("+");
                  fabBtn.setTextSize(30f);
                  fabBtn.setTextColor(Color.WHITE);
                  GradientDrawable fabBg = new GradientDrawable();
                  fabBg.setShape(GradientDrawable.OVAL);
                  fabBg.setColor(Color.parseColor("#1A202C"));
                  fabBg.setStroke(4, Color.parseColor("#38BDF8"));
                  fabBtn.setBackground(fabBg);
                  fabBtn.setElevation(12f);
                  FrameLayout.LayoutParams fabLp = new FrameLayout.LayoutParams(130, 130);
                  fabLp.gravity = Gravity.END | Gravity.BOTTOM;
                  fabLp.setMargins(0, 0, 40, 40);
                  fabBtn.setLayoutParams(fabLp);
                  fabBtn.setOnClickListener(v -> show3DChooseActionDialog());

                  fabLayout.addView(fabBtn);

                  mainContainer.addView(dashboardHeader);
                  mainContainer.addView(projectHeader);
                  mainContainer.addView(noticeListLayout);
                  mainContainer.addView(editorLayout);
                  mainContainer.addView(fabLayout);

                  drawerLayout.addView(mainContainer);
                  setContentView(drawerLayout);
              }

              private int mixWith50PercentWhite(int color) {
                  int r = (Color.red(color) + 255) / 2;
                  int g = (Color.green(color) + 255) / 2;
                  int b = (Color.blue(color) + 255) / 2;
                  return Color.rgb(r, g, b);
              }

              private void generate48ColorsData() {
                  color48List.clear();
                  for (int col : original24Colors) color48List.add(col);
                  for (int col : original24Colors) color48List.add(mixWith50PercentWhite(col));
              }

              private void closeEditor() {
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  imm.hideSoftInputFromWindow(noteEditText.getWindowToken(), 0);
                  projectHeader.setVisibility(View.GONE);
                  editorLayout.setVisibility(View.GONE);
                  dashboardHeader.setVisibility(View.VISIBLE);
                  noticeListLayout.setVisibility(View.VISIBLE);
                  activeColor = Color.BLACK;
              }

              private void saveCurrentNote() {
                  Toast.makeText(this, "Page saved successfully!", Toast.LENGTH_SHORT).show();
                  closeEditor();
              }

              private void openCompactColorPicker() {
                  Toast.makeText(this, "Color Picker Opened (Java Mode)", Toast.LENGTH_SHORT).show();
              }

              private void showPageStyleDialog() {
                  Toast.makeText(this, "Style Dialog Opened (Java Mode)", Toast.LENGTH_SHORT).show();
              }

              private void toggleEditorLockState() {
                  isPageEditorLocked = !isPageEditorLocked;
                  if (isPageEditorLocked) {
                      lockToggleBtn.setText("🔒");
                      noteEditText.setFocusable(false);
                      noteEditText.setFocusableInTouchMode(false);
                      Toast.makeText(this, "🔒 Page Locked", Toast.LENGTH_SHORT).show();
                  } else {
                      lockToggleBtn.setText("🔓");
                      noteEditText.setFocusable(true);
                      noteEditText.setFocusableInTouchMode(true);
                      Toast.makeText(this, "🔓 Unlocked!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void show3DChooseActionDialog() {
                 Toast.makeText(this, "Create Dialog (Java Mode)", Toast.LENGTH_SHORT).show();
              }

              @Override
              public void onBackPressed() {
                  if (editorLayout.getVisibility() == View.VISIBLE) {
                      closeEditor();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # Compile and Build the App
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Output the final file for you to download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zeeshan-Notice-App-Java-Edition
          path: app/build/outputs/apk/debug/app-debug.apk

