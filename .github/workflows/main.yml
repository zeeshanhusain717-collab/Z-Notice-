                          <item android:offset="1.0" android:color="#E2DDD5" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Ruled Lines -->
              <path android:pathData="M 145,110 L 380,110 M 145,150 L 380,150 M 145,190 L 380,190 M 145,230 L 380,230 M 145,270 L 380,270 M 145,310 L 380,310 M 145,350 L 380,350 M 145,390 L 380,390"
                  android:strokeColor="#E0DCD5"
                  android:strokeWidth="1.5" />

              <!-- Red Margin Line -->
              <path android:pathData="M 175,55 L 175,435"
